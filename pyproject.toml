[project]
name = "skripsi-yolo11-qat-openvino"
version = "0.1.0"
description = "Reproducible research pipeline for YOLO11n QAT and OpenVINO deployment."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "nncf==2.13.0",
    "numpy==1.26.4",
    "onnx>=1.16,<1.18",
    "onnxruntime>=1.18,<1.21",
    "opencv-python-headless==4.10.0.84",
    "openvino==2024.4.0",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "roboflow==1.2.16",
    "setuptools>=70.0.0",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "ultralytics==8.4.130",
    "wandb>=0.29.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
